name: progress_os
description: "ProgressOS - Personal productivity application focused on schedules, tasks, and progress tracking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Supabase & Auth & Realtime
  supabase_flutter: ^2.6.0

  # Persistence
  shared_preferences: ^2.2.3

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # UI Helper Tools
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0
  flutter_slidable: ^3.1.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Code Generation helper annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation Tools
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
